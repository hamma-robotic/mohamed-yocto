header:
  version: 11

build_system: oe

machine: raspberrypi4-64
distro: poky

repos:
  poky:
    url: "https://git.yoctoproject.org/poky"
    refspec: scarthgap
    layers:
      meta
      meta-poky
      meta-yocto-bsp

  meta-raspberrypi:
    url: "https://github.com/agherzan/meta-raspberrypi.git"
    refspec: scarthgap
    layers:
      meta-raspberrypi

  meta-openembedded:
    url: "https://github.com/openembedded/meta-openembedded.git"
    refspec: scarthgap
    layers:
      meta-oe
      meta-python
      meta-multimedia
      meta-networking
